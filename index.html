<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои задачи</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <button id="theme-toggle" class="theme-toggle" title="Сменить тему">🌙</button>

    <div class="app-container">
        <header class="app-header">
            <h1>Мои задачи</h1>
            <p class="subtitle">Планируй свой день с умом</p>
        </header>

        <form id="task-form" class="task-form">
            <input type="text" id="task-input" placeholder="Что нужно сделать?" autocomplete="off">
            <button type="submit" class="btn-add">
                <span>+</span> Добавить
            </button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
        </div>

        <ul id="task-list" class="task-list">

        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
